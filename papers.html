        /* Small styling for the number */
        .paper-number {
            font-weight: bold;
            color: #888;

        }

        /* --- Tag filter pills --- */
        .filter-row {
            width: 100%;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .filter-pill {
            font-family: 'Fenix', serif;
            font-size: 0.9rem;
            border-radius: 12px;
            padding: 1px 12px;
            margin-left: 4px;
            cursor: pointer;
            background: #fff;
            border: 1px solid;
            transition: all 0.15s;
        }
        /* pill colors extracted from the hanusa.xyz logo:
           research red #e7210e, design teal #13b272, education blue #1d5adc
           (strategy, for the talks page later: darker yellow #b8860b) */

        .pill-research  { color: #e7210e; border-color: #e7210e; }
        .pill-design    { color: #13b272; border-color: #13b272; }
        .pill-education { color: #1d5adc; border-color: #1d5adc; }
        .pill-all.active       { background: #555;    color: #fff; }
        .pill-research.active  { background: #e7210e; color: #fff; }
        .pill-design.active    { background: #13b272; color: #fff; }
        .pill-education.active { background: #1d5adc; color: #fff; }
        .filter-count { color: #888; margin-left: 8px; }
        .paper-item.tag-hidden { display: none; }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('papers-container');
            const abstractBtn = document.getElementById('abstract-toggle');
            const bibtexBtn = document.getElementById('bibtex-toggle');
            
            let abstractsVisible = false;
            let bibtexVisible = false;

            // --- HELPER: FORMAT AUTHORS HTML ---
            function formatAuthorsHtml(authors) {
                if (!authors || authors.length === 0) return "";
                
                // Convert each author object to a string (clickable if url exists)
                const parts = authors.map(a => {
                    return a.url ? `<a href="${a.url}" target="_blank" style="color:inherit; text-decoration:none; border-bottom:1px dotted #666;">${a.name}</a>` : a.name;
                });

                // Join with commas and 'and'
                if (parts.length === 1) return parts[0];
                if (parts.length === 2) return parts.join(" and ");
                return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
            }

            // --- HELPER: FORMAT AUTHORS TEXT (For BibTeX) ---
            function formatAuthorsBibtex(authors) {
                if (!authors) return "";
                return authors.map(a => a.name).join(" and ");
            }

            // --- BIBTEX GENERATOR FUNCTION ---
            function generateBibtex(p) {
                const authorsText = formatAuthorsBibtex(p.authors);
                let bib = `@article{${p.id},
  title={${p.title}},
  author={${authorsText}},
  journal={${p.venue || p.journal || "Preprint"}},
  year={${p.year}}`;
                
                // Add volume if it exists
                if (p.volume) {
                    bib += `,\n  volume={${p.volume}}`;
                }
                
                bib += `\n}`;
                return bib;
            }

            // 1. Fetch Data
            fetch('papers.json')
                .then(response => {
                    if (!response.ok) throw new Error("Could not load papers.json");
                    return response.json();
                })
                .then(papers => {
                    container.innerHTML = ''; 

                    papers.forEach(paper => {
                        const article = document.createElement('article');
                        article.className = 'paper-item';
                        article.dataset.tags = (paper.tags || ['research']).join(' ');

                        // --- LINKS LOGIC ---
                        let linksHtml = '';
                        
                        // 1. PDF Link (Only if showPDF is not explicitly false)
                        if (paper.showPDF !== false) {
                            const pdfUrl = `https://hanusa.xyz/research/papers/${paper.id}.pdf`;
                            linksHtml += `<a href="${pdfUrl}" target="_blank">[PDF]</a>`;
                        }

                        // 2. Extra Links from JSON
                        if (paper.links && paper.links.length > 0) {
                            linksHtml += paper.links.map(link => 
                                `<a href="${link.url}" target="_blank">[${link.label}]</a>`
                            ).join('');
                        }

                        // --- CONTENT GENERATION ---
                        const authorsHtml = formatAuthorsHtml(paper.authors);
                        const bibtexString = generateBibtex(paper);
                        
                        // Handle Venue and Volume Display
                        let venueText = paper.venue || paper.journal || "";
                        if (paper.volume) {
                            venueText += `, Vol ${paper.volume}`;
                        }
                        
                        // Handle Numbering (Ensure space after dot)
                        const numberStr = paper.number ? `<span class="paper-number">${paper.number}.</span>` : "";

                        article.innerHTML = `
                            <span class="paper-title">${numberStr} ${paper.title}</span>
                            <div class="paper-meta">
                                ${authorsHtml}. <b>${venueText}</b> (${paper.year}). ${paper.status ? `(${paper.status})` : ''}
                            </div>
                            <div class="paper-links">
                                ${linksHtml}
                            </div>
                            
                            <div class="paper-abstract">
                                <strong>Abstract:</strong> ${paper.abstract}
                            </div>

                            <div class="paper-bibtex"><button class="copy-btn" onclick="copyToClipboard(this)">Copy</button><span class="bibtex-text">${bibtexString}</span></div>
                        `;
                        container.appendChild(article);
                    });

                    // Deep link: e.g. #education pre-activates that filter
                    const initTag = location.hash.replace('#','').toLowerCase();
                    const initPill = document.querySelector(`.filter-pill[data-tag="${initTag}"]`);
                    if (initPill) initPill.click();
                })
                .catch(error => {
                    console.error("Error:", error);
                    container.innerHTML = '<p>Unable to load publication list.</p>';
                });

            // 1b. Tag filtering
            const pills = document.querySelectorAll('.filter-pill');
            const countEl = document.getElementById('filter-count');
            function applyFilter(tag) {
                const items = container.querySelectorAll('.paper-item');
                let shown = 0;
                items.forEach(item => {
                    const match = (tag === 'all') || item.dataset.tags.split(' ').includes(tag);
                    item.classList.toggle('tag-hidden', !match);
                    if (match) shown++;
                });
                countEl.textContent = (tag === 'all') ? '' : `Showing ${shown} of ${items.length}`;
            }
            pills.forEach(pill => {
                pill.addEventListener('click', function() {
                    pills.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    applyFilter(this.dataset.tag);
                    history.replaceState(null, '', this.dataset.tag === 'all'
                        ? location.pathname : '#' + this.dataset.tag);
                });
            });

            // 2. Toggle Abstracts
            abstractBtn.addEventListener('click', function() {
                abstractsVisible = !abstractsVisible;
                if (abstractsVisible) {
                    container.classList.add('show-abstracts');
                    abstractBtn.textContent = "Hide Abstracts";
                    abstractBtn.classList.add('active');
                } else {
                    container.classList.remove('show-abstracts');
                    abstractBtn.textContent = "Show Abstracts";
                    abstractBtn.classList.remove('active');
                }
            });

            // 3. Toggle BibTeX
            bibtexBtn.addEventListener('click', function() {
                bibtexVisible = !bibtexVisible;
                if (bibtexVisible) {
                    container.classList.add('show-bibtex');
                    bibtexBtn.textContent = "Hide BibTeX";
                    bibtexBtn.classList.add('active');
                } else {
                    container.classList.remove('show-bibtex');
                    bibtexBtn.textContent = "Show BibTeX";
                    bibtexBtn.classList.remove('active');
                }
            });
        });

        // 4. Global Copy Function
        function copyToClipboard(btn) {
            const textToCopy = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            });
        }
    </script>
