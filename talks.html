<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Venue list styling */
        .talk-venues {
            list-style: none;
            margin: 8px 0 0 0;
        }
        .talk-venues li {
            font-size: 1.05em;
            color: #555;
            padding-left: 18px;
            position: relative;
            margin-bottom: 4px;
        }
        .talk-venues li::before {
            content: "\2022";
            color: var(--primary-color);
            position: absolute;
            left: 0;
        }
        .talk-venues a { color: inherit; text-decoration: none; border-bottom: 1px dotted #666; }
        .talk-venues a:hover { color: var(--primary-color); }
        .paper-abstract ul { margin: 10px 0 0 25px; }
        .paper-abstract p + p { margin-top: 10px; }

        /* --- Tag filter pills (colors from the hanusa.xyz logo:
           research red #e7210e, design teal #13b272, education blue #1d5adc,
           strategy darker yellow #b8860b) --- */
        .filter-row {
            width: 100%;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .filter-pill {
            font-family: 'Fenix', serif;
            font-size: 0.9rem;
            border-radius: 12px;
            padding: 1px 12px;
            margin-left: 4px;
            cursor: pointer;
            background: #fff;
            border: 1px solid;
            transition: all 0.15s;
        }
        .pill-all       { color: #555;    border-color: #999; }
        .pill-research  { color: #e7210e; border-color: #e7210e; }
        .pill-design    { color: #13b272; border-color: #13b272; }
        .pill-education { color: #1d5adc; border-color: #1d5adc; }
        .pill-strategy  { color: #b8860b; border-color: #b8860b; }
        .pill-all.active       { background: #555;    color: #fff; }
        .pill-research.active  { background: #e7210e; color: #fff; }
        .pill-design.active    { background: #13b272; color: #fff; }
        .pill-education.active { background: #1d5adc; color: #fff; }
        .pill-strategy.active  { background: #b8860b; color: #fff; }
        .filter-count { color: #888; margin-left: 8px; }
        .paper-item.tag-hidden { display: none; }
    </style>
</head>
<body>

    <nav id="main-nav">
        <div class="nav-brand">
            <a href="index.html"><img src="images/hanusa-xyz.png" alt="hanusa.xyz logo" height="50px"></a>
        </div>
        <div class="nav-links">
            <a href="research.html" class="active" style="color:#e7210e;">Research</a>
            <a href="design.html">Design</a> 
            <a href="education.html">Education</a>
            <a href="strategy.html">Strategy</a>
            <a href="https://hanusa.xyz/blog">Insights</a>
            <a href="contact.html">Contact</a>
        </div>
        <span class="nav-current" style="color:#e7210e;">Research</span>
                <button class="nav-toggle" aria-label="Menu" aria-expanded="false"
            onclick="var n=document.getElementById('main-nav');n.classList.toggle('nav-open');this.setAttribute('aria-expanded',n.classList.contains('nav-open'));">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main class="single-column-layout">
        
        <div class="controls">
            <h2>Talks</h2>
            <div class="button-group">
                <button id="abstract-toggle" class="toggle-btn">Show Abstracts</button>
            </div>
            <div class="filter-row">
                Filter this list:
                <button class="filter-pill pill-all active" data-tag="all">All</button>
                <button class="filter-pill pill-research" data-tag="research">Research</button>
                <button class="filter-pill pill-design" data-tag="design">Design</button>
                <button class="filter-pill pill-education" data-tag="education">Education</button>
                <button class="filter-pill pill-strategy" data-tag="strategy">Strategy</button>
                <span class="filter-count" id="filter-count"></span>
            </div>
        </div>

        <div id="talks-container">
            <p style="text-align:center; color:#888;">Loading talks...</p>
        </div>

    </main>

    <footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('talks-container');
            const abstractBtn = document.getElementById('abstract-toggle');
            
            let abstractsVisible = false;

            // 1. Fetch Data
            fetch('talks.json')
                .then(response => {
                    if (!response.ok) throw new Error("Could not load talks.json");
                    return response.json();
                })
                .then(talks => {
                    container.innerHTML = ''; 

                    talks.forEach(talk => {
                        const article = document.createElement('article');
                        article.className = 'paper-item';
                        article.dataset.tags = (talk.tags || ['research']).join(' ');

                        // --- MATERIALS LINKS ---
                        let linksHtml = '';
                        if (talk.materials && talk.materials.length > 0) {
                            linksHtml = talk.materials.map(link => 
                                `<a href="${link.url}" target="_blank">[${link.label}]</a>`
                            ).join('');
                        }

                        // --- VENUES ---
                        const venuesHtml = (talk.venues || []).map(v => `<li>${v}</li>`).join('');

                        // --- ABSTRACT (optional) ---
                        const abstractHtml = talk.abstract 
                            ? `<div class="paper-abstract"><strong>Abstract:</strong> ${talk.abstract}</div>` 
                            : '';

                        article.innerHTML = `
                            <span class="paper-title">${talk.title}</span>
                            <div class="paper-links">
                                ${linksHtml}
                            </div>
                            <ul class="talk-venues">
                                ${venuesHtml}
                            </ul>
                            ${abstractHtml}
                        `;
                        container.appendChild(article);
                    });

                    // Deep link: e.g. #education pre-activates that filter
                    const initTag = location.hash.replace('#','').toLowerCase();
                    const initPill = document.querySelector(`.filter-pill[data-tag="${initTag}"]`);
                    if (initPill) initPill.click();
                })
                .catch(error => {
                    console.error("Error:", error);
                    container.innerHTML = '<p>Unable to load talk list.</p>';
                });

            // 1b. Tag filtering
            const pills = document.querySelectorAll('.filter-pill');
            const countEl = document.getElementById('filter-count');
            function applyFilter(tag) {
                const items = container.querySelectorAll('.paper-item');
                let shown = 0;
                items.forEach(item => {
                    const match = (tag === 'all') || item.dataset.tags.split(' ').includes(tag);
                    item.classList.toggle('tag-hidden', !match);
                    if (match) shown++;
                });
                countEl.textContent = (tag === 'all') ? '' : `Showing ${shown} of ${items.length}`;
            }
            pills.forEach(pill => {
                pill.addEventListener('click', function() {
                    pills.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    applyFilter(this.dataset.tag);
                    history.replaceState(null, '', this.dataset.tag === 'all'
                        ? location.pathname : '#' + this.dataset.tag);
                });
            });

            // 2. Toggle Abstracts
            abstractBtn.addEventListener('click', function() {
                abstractsVisible = !abstractsVisible;
                if (abstractsVisible) {
                    container.classList.add('show-abstracts');
                    abstractBtn.textContent = "Hide Abstracts";
                    abstractBtn.classList.add('active');
                } else {
                    container.classList.remove('show-abstracts');
                    abstractBtn.textContent = "Show Abstracts";
                    abstractBtn.classList.remove('active');
                }
            });
        });
    </script>

    <script data-goatcounter="https://hanusaxyz.goatcounter.com/count"

</body>
